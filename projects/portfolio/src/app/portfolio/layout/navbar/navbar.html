<a class="skip" href="#about">Skip to content</a>

<div class="bar shell">
  <!-- Brand -->
  <a class="brand" href="#home" (click)="go('home', $event)" aria-label="Pradeep Chauhan — home">
    <span class="brand__mark">
      <span class="brand__initials">PC</span>
    </span>
    <span class="brand__text">
      <strong>Pradeep</strong>
      <em>Chauhan</em>
    </span>
  </a>

  <!-- Desktop links -->
  <nav class="links" aria-label="Sections">
    @for (item of navItems; track item.id) {
      <a
        class="link"
        [class.is-active]="scroll.activeSection() === item.id"
        [href]="'#' + item.id"
        (click)="go(item.id, $event)"
        [attr.aria-current]="scroll.activeSection() === item.id ? 'true' : null"
      >
        <span class="link__index">{{ item.index }}</span>
        <span class="link__label">{{ item.label }}</span>
      </a>
    }
  </nav>

  <!-- Actions -->
  <div class="actions">
    <button
      type="button"
      class="icon-btn"
      (click)="theme.toggle()"
      [attr.aria-label]="theme.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    >
      <span class="icon-btn__swap" [class.is-light]="theme.theme() === 'light'">
        <app-icon name="moon" [size]="18" />
        <app-icon name="sun" [size]="18" />
      </span>
    </button>

    <a
      class="icon-btn resume"
      [href]="profile.resumeUrl"
      target="_blank"
      rel="noopener"
      aria-label="Download résumé (PDF)"
    >
      <app-icon name="download" [size]="18" />
    </a>

    <a class="btn btn--primary btn--sm hire" href="#contact" (click)="go('contact', $event)" [appMagnetic]="8">
      Hire me
      <app-icon name="arrowUpRight" [size]="16" />
    </a>

    <button
      type="button"
      class="icon-btn burger"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
    >
      <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="20" />
    </button>
  </div>
</div>

<!-- Mobile drawer -->
<div id="mobile-menu" class="drawer" [class.is-open]="menuOpen()">
  <nav class="drawer__links" aria-label="Sections">
    @for (item of navItems; track item.id) {
      <a
        class="drawer__link"
        [class.is-active]="scroll.activeSection() === item.id"
        [href]="'#' + item.id"
        (click)="go(item.id, $event)"
        [style.--stagger.ms]="$index * 55"
      >
        <span class="mono">{{ item.index }}</span>
        {{ item.label }}
        <app-icon name="arrowUpRight" [size]="16" />
      </a>
    }
  </nav>

  <div class="drawer__foot">
    <a class="drawer__contact" [href]="'mailto:' + profile.email">
      <app-icon name="mail" [size]="16" />
      {{ profile.email }}
    </a>
    <a class="drawer__contact" [href]="'tel:' + profile.phone.replace(' ', '')">
      <app-icon name="phone" [size]="16" />
      {{ profile.phone }}
    </a>
  </div>
</div>
