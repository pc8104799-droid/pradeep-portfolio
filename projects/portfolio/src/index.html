  <style>
    /* Boot splash — painted before Angular hydrates, removed by the app shell. */
    #boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #07070c;
      transition: opacity .5s ease, visibility .5s ease;
    }
    #boot.is-done { opacity: 0; visibility: hidden; }
    #boot .boot-mark {
      font: 700 clamp(2rem, 6vw, 3.5rem)/1 "Sora", system-ui, sans-serif;
      letter-spacing: -.04em;
      background: linear-gradient(110deg, #7c5cff, #00d4ff 45%, #ff5cf1);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: bootPulse 1.4s ease-in-out infinite;
    }
    #boot .boot-bar {
      margin-top: 1.25rem;
      width: 160px;
      height: 2px;
      border-radius: 99px;
      background: rgba(255, 255, 255, .1);
      overflow: hidden;
    }
    #boot .boot-bar span {
      display: block;
      height: 100%;
      width: 40%;
      border-radius: 99px;
      background: linear-gradient(90deg, #7c5cff, #00d4ff);
      animation: bootSlide 1.1s ease-in-out infinite;
    }
    @keyframes bootPulse { 0%, 100% { opacity: 1 } 50% { opacity: .45 } }
    @keyframes bootSlide { 0% { transform: translateX(-110%) } 100% { transform: translateX(310%) } }
  </style>
</head>

<body>
  <div id="boot" aria-hidden="true">
    <div style="text-align:center">
      <div class="boot-mark">PRADEEP</div>
      <div class="boot-bar"><span></span></div>
    </div>
  </div>
